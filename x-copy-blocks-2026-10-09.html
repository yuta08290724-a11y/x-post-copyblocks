<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X図解 画像プロンプト</title>
<style>
  :root {
    --bg: #faf7f2;
    --card-bg: #ffffff;
    --text: #2c2c26;
    --sub-text: #6b6b60;
    --green-deep: #3a5a40;
    --green-mid: #588157;
    --orange: #e07a3f;
    --border: #e5ddd0;
    --shadow: 0 2px 10px rgba(58, 90, 64, 0.08), 0 1px 3px rgba(0,0,0,0.04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: linear-gradient(180deg, #faf7f2 0%, #f5efe4 100%);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.7;
    padding: 20px 12px 60px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header.page-header {
    background: var(--card-bg);
    border-radius: 18px;
    padding: 20px 20px 18px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    border: 1px solid var(--border);
  }
  header.page-header h1 { margin: 0 0 6px; font-size: 1.3rem; color: var(--green-deep); letter-spacing: 0.02em; }
  header.page-header .date { font-size: 0.9rem; color: var(--sub-text); margin-bottom: 12px; }
  .rank-line { font-size: 0.85rem; color: var(--text); background: #f0ede3; border-radius: 10px; padding: 10px 12px; line-height: 1.6; }
  .rank-line strong { color: var(--orange); }
  .cards { display: flex; flex-direction: column; gap: 18px; }
  .card { background: var(--card-bg); border-radius: 18px; box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden; }
  .card.accent-recipe { border-left: 5px solid var(--orange); }
  .card-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; gap: 8px; flex-wrap: wrap; }
  .top-left, .top-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { display: inline-flex; align-items: center; font-size: 0.78rem; font-weight: 700; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .badge-no { background: var(--green-deep); color: #fff; }
  .badge-time { background: #eef2ea; color: var(--green-mid); border: 1px solid #d8e3d3; }
  .badge-score { background: #fdece0; color: var(--orange); border: 1px solid #f6d3ba; }
  .badge-count { background: #f0ede3; color: var(--sub-text); font-weight: 500; }
  .card-body { padding: 4px 16px 16px; white-space: pre-wrap; word-break: break-word; font-size: 0.95rem; line-height: 1.9; color: var(--text); }
  .card-footer { padding: 0 16px 16px; }
  .copy-btn { width: 100%; min-height: 52px; border: none; border-radius: 12px; background: var(--green-mid); color: #fff; font-size: 1rem; font-weight: 700; letter-spacing: 0.03em; cursor: pointer; transition: background-color 0.2s ease, transform 0.1s ease; font-family: inherit; }
  .copy-btn:active { transform: scale(0.98); }
  .copy-btn:hover { background: var(--green-deep); }
  .copy-btn.copied { background: var(--orange); }
  footer.page-footer { text-align: center; font-size: 0.75rem; color: var(--sub-text); margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="page-header">
    <h1>X図解 画像プロンプト</h1>
    <div class="date">2026-10-09</div>
    <div class="rank-line">推奨順位：<strong>1位=No.1（52点）</strong> / 2位=No.5（52点） / 3位=No.3（51点）</div>
  </header>
  <div class="cards">
    <div class="card" data-card="1">
      <div class="card-top">
        <div class="top-left">
          <span class="badge badge-no">No.1</span>
          <span class="badge badge-time">11:00</span>
        </div>
        <div class="top-right">
          <span class="badge badge-score">52点</span>
          <span class="badge badge-count" data-count-for="1">0字</span>
        </div>
      </div>
      <div class="card-body" data-body="1"></div>
      <div class="card-footer">
        <button class="copy-btn" data-copy-btn="1">コピー</button>
      </div>
    </div>

    <div class="card" data-card="3">
      <div class="card-top">
        <div class="top-left">
          <span class="badge badge-no">No.3</span>
          <span class="badge badge-time">14:00</span>
        </div>
        <div class="top-right">
          <span class="badge badge-score">51点</span>
          <span class="badge badge-count" data-count-for="3">0字</span>
        </div>
      </div>
      <div class="card-body" data-body="3"></div>
      <div class="card-footer">
        <button class="copy-btn" data-copy-btn="3">コピー</button>
      </div>
    </div>

    <div class="card accent-recipe" data-card="5a">
      <div class="card-top">
        <div class="top-left">
          <span class="badge badge-no">No.5-①</span>
          <span class="badge badge-time">18:00</span>
        </div>
        <div class="top-right">
          <span class="badge badge-score">52点</span>
          <span class="badge badge-count" data-count-for="5a">0字</span>
        </div>
      </div>
      <div class="card-body" data-body="5a"></div>
      <div class="card-footer">
        <button class="copy-btn" data-copy-btn="5a">コピー</button>
      </div>
    </div>

    <div class="card accent-recipe" data-card="5b">
      <div class="card-top">
        <div class="top-left">
          <span class="badge badge-no">No.5-②</span>
          <span class="badge badge-time">18:00</span>
        </div>
        <div class="top-right">
          <span class="badge badge-score">52点</span>
          <span class="badge badge-count" data-count-for="5b">0字</span>
        </div>
      </div>
      <div class="card-body" data-body="5b"></div>
      <div class="card-footer">
        <button class="copy-btn" data-copy-btn="5b">コピー</button>
      </div>
    </div>

    <div class="card accent-recipe" data-card="5c">
      <div class="card-top">
        <div class="top-left">
          <span class="badge badge-no">No.5-③</span>
          <span class="badge badge-time">18:00</span>
        </div>
        <div class="top-right">
          <span class="badge badge-score">52点</span>
          <span class="badge badge-count" data-count-for="5c">0字</span>
        </div>
      </div>
      <div class="card-body" data-body="5c"></div>
      <div class="card-footer">
        <button class="copy-btn" data-copy-btn="5c">コピー</button>
      </div>
    </div>
  </div>
  <footer class="page-footer">タップでコピー → 画像生成AIに貼り付け（シェフ入りは official-chef.jpg を添付）</footer>
</div>

<script>
(function () {
  "use strict";

  var POSTS = {
    "1": `添付のシェフ画像を顔立ち・髪型（コーンロウ）・髭・肌の色・墨絵タッチの画風まで忠実に再現し、同一人物として描くこと。変更してよいのは表情・ポーズ・リアクションのみ（服装・髪型・顔立ち・アートスタイルは変更禁止）

GPT Image 2.0用。横長1600×640（アスペクト比5:2）の広告ポスター風X図解。黒背景・白文字・黄色見出し・赤アクセント。極太ゴシック、余白広め、スマホで0.5秒で理解できる構成。

左側：極太の黄色見出し「寝る前の空腹、我慢が正解？」。その下に白文字で「スナック菓子より、素焼きアーモンドひとつかみ」。赤い小さな帯で「原材料はアーモンドだけ」。
右側（主役・最大）：手のひらに乗った素焼きアーモンドひとつかみ（約20粒）を大きく。背景に夜の部屋の暗いシルエットを控えめに。
右下：シェフがアーモンドを差し出し、穏やかに笑う表情（吹き出し「我慢より、ひとつかみや」）。
実在商品のロゴ・パッケージは描かない（無地の袋で汎用デザインにする）。本文にない効能・数値は書かない。`,
    "3": `添付のシェフ画像を顔立ち・髪型（コーンロウ）・髭・肌の色・墨絵タッチの画風まで忠実に再現し、同一人物として描くこと。変更してよいのは表情・ポーズ・リアクションのみ（服装・髪型・顔立ち・アートスタイルは変更禁止）

GPT Image 2.0用。横長1600×640（アスペクト比5:2）の広告ポスター風X図解。黒背景・白文字・黄色見出し・赤アクセント。極太ゴシック、余白広め、スマホで0.5秒で理解できる構成。

上部：極太の黄色見出し「疲れた夜の固定セット」。白文字サブ「サラダチキン＋サラダで安心してへんか？」。
中央：3列のランキング。左から🥉「サラダチキン＋カットサラダ」（冷たいまま胃に入る）、🥈「鮭おにぎり＋カップ味噌汁」（温かい汁で胃が起きる）、🥇「鮭おにぎり＋ゆで卵＋豆腐入り味噌汁」（説明は「理由は次で」の赤帯で伏せる）。🥇の列を一番大きく、湯気の立つ味噌汁を主役に。
右端：シェフが腕を組んで頷く表情。
実在商品のロゴ・パッケージは描かない（汎用デザイン）。本文にない効能・数値は書かない。`,
    "5a": `GPT Image 2.0用。縦長1024×1536。背景はクリーム色〜ライトベージュの紙質感フラットデザイン。極太ゴシック、余白広め、スマホで0.5秒で理解。実在商品のロゴ・パッケージは描かない。

パネル①（フック＋材料）
3行見出し：「金曜の夜、／胃がガッツリを／受け付けへん人へ」（「胃」を黄色マーカー）
手書き風の小吹き出し：「豚こまをさば缶に変えるだけ」
（冷凍ごぼう等はスーパー調達のため、ピンクのリボン「コンビニで全部そろう！」は省略）
中央〜下：湯気の立つ、さばときのこの味噌汁の完成写真を大きく（ほぐしたさば・きのこ・ごぼう・赤いフレーク唐辛子が見える）。
料理名を極太文字で「さばときのこのレンジ味噌汁」。
時短4バッジ：「7分」「レンジ」「包丁なし」「550円目安」
右に「材料（1人分）」パネル（アイコン付き）：さば水煮缶1缶（汁ごと）／冷凍きのこミックス100g／冷凍ささがきごぼう50g／味噌 小さじ2〜大さじ1／水250ml／隠し味：フレーク唐辛子ひとつまみ
最下部：「作り方は次へ」`,
    "5b": `GPT Image 2.0用。縦長1024×1536。背景はクリーム色〜ライトベージュの紙質感フラットデザイン。極太ゴシック、余白広め、スマホで0.5秒で理解。実在商品のロゴ・パッケージは描かない。

パネル②（手順）
大見出し：「7分で完成！」＋バッジ再掲（7分・レンジ・包丁なし・550円目安）
手順を3つ縦に並べる（丸数字バッジ＋短い見出し＋工程写真）：
①「凍ったまま入れて600W4分」：耐熱ボウルに水・冷凍きのこ・冷凍ごぼう、ふんわりラップ
②「さば缶を汁ごと＋味噌で1分半」：スプーンでさばを粗くほぐし、味噌を溶く。小さな注記「汁は捨てない＝出汁がわり」
③「唐辛子をひとつまみ」：器に移して赤いフレーク唐辛子をのせる、湯気がふわっと
最下部：「味の理由は次へ」`,
    "5c": `添付のシェフ画像を顔立ち・髪型（コーンロウ）・髭・肌の色・墨絵タッチの画風まで忠実に再現し、同一人物として描くこと。変更してよいのは表情・ポーズ・リアクションのみ（服装・髪型・顔立ち・アートスタイルは変更禁止）

GPT Image 2.0用。縦長1024×1536。背景はクリーム色〜ライトベージュの紙質感フラットデザイン。極太ゴシック、余白広め、スマホで0.5秒で理解。実在商品のロゴ・パッケージは描かない。

パネル③（なぜこの組み合わせ＋保存CTA）
見出し：「なぜ さば缶×味噌？」 サブコピー：「豚汁の豚を、缶詰に替えただけ」
理由リスト4項目：
・さば缶の汁が出汁がわりになる
・きのこ・ごぼうで食物繊維、味噌で発酵食品
・唐辛子のピリッとで魚の脂が重くならない
・包丁なし・煮込みなしで7分
中央：湯気の立つ完成写真。
シェフ登場：お椀を両手で差し出し、吹き出しで「1週間ようがんばったな、温かい一杯や」。
弱点ボックス：「塩気が強めになりやすい → 味噌は小さじ2から味見して足す」
最下部の赤帯：「保存して、来週の金曜もこれで」`
  };

  Object.keys(POSTS).forEach(function (key) {
    var text = POSTS[key];
    var bodyEl = document.querySelector('[data-body="' + key + '"]');
    var countEl = document.querySelector('[data-count-for="' + key + '"]');
    if (bodyEl) bodyEl.textContent = text;
    if (countEl) countEl.textContent = text.length + "字";
  });

  function copyText(text) {
    return new Promise(function (resolve, reject) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(resolve).catch(function () {
          fallbackCopy(text) ? resolve() : reject(new Error("fallback copy failed"));
        });
      } else {
        fallbackCopy(text) ? resolve() : reject(new Error("fallback copy failed"));
      }
    });
  }

  function fallbackCopy(text) {
    var textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.top = "0";
    textarea.style.left = "0";
    textarea.style.width = "1px";
    textarea.style.height = "1px";
    textarea.style.padding = "0";
    textarea.style.border = "none";
    textarea.style.outline = "none";
    textarea.style.boxShadow = "none";
    textarea.style.background = "transparent";
    textarea.style.opacity = "0";
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    textarea.setSelectionRange(0, textarea.value.length);
    var success = false;
    try { success = document.execCommand("copy"); } catch (err) { success = false; }
    document.body.removeChild(textarea);
    return success;
  }

  document.querySelectorAll(".copy-btn").forEach(function (btn) {
    var key = btn.getAttribute("data-copy-btn");
    btn.addEventListener("click", function () {
      var text = POSTS[key];
      if (!text) return;
      copyText(text).then(function () {
        showCopied(btn);
      }).catch(function () {
        btn.textContent = "コピー失敗";
        setTimeout(function () { btn.textContent = "コピー"; }, 1500);
      });
    });
  });

  function showCopied(btn) {
    btn.textContent = "✓ コピーしました";
    btn.classList.add("copied");
    setTimeout(function () {
      btn.textContent = "コピー";
      btn.classList.remove("copied");
    }, 1500);
  }
})();
</script>
</body>
</html>
